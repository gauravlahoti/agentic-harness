# Runs the same `make check` you run locally, plus a secret scan.
# No API key here: live Gemini tests never run in CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # least privilege: CI can read the code, nothing else

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: make check

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run pre-commit run gitleaks --all-files
