# CloudCo's Contract Agent: one workspace on the harness.
# Read by the harness only; the model never sees this file (spec/02-ui.md, D-12).
# CloudCo, ShopCo, people and numbers are all fictional.

name = "Contract Agent"
owner = "CloudCo"
description = "Checks contract changes against CloudCo's terms and says who must approve."
logo = "logo.svg"  # a made-up mark, shown at the top of the page

# Every name, number and contract here is invented: the page tags it "Synthetic Data".
synthetic_data = true

# The agent may pause to ask the person a question when something it needs is missing (D-89).
ask_human = true

# The agent may keep short notes between tasks, per profile (D-92).
notes = true

# The agent may keep a to-do list for a task with 3+ parts; it can't finish with items open (S11).
plan = true

# Always in the prompt, in this order. {profile} picks the active profile's file.
memory = ["AGENTS.md", "teams/{profile}.md", "answer-style.md"]  # how to answer: always loaded (D-129)

# One line per skill in the prompt; load_skill reads the rest. Each profile sees its own folder.
skills = ["skills/{profile}"]  # each team its own (D-107): Sales reviews and replies, Engineering checks technical clauses

memory_budget_tokens = 2000

# CloudCo's four tools live in tools.py (D-73). It uses no built-in file tools.

# Words that must never appear inside the harness (S02-AC9).
domain_words = ["cloudco", "shopco", "contract", "discount", "liability", "renewal", "redline", "uptime", "clause"]

examples = [
  "ShopCo wants 25% off and unlimited liability. Can we agree?",
  "Can we promise ShopCo 99.99% uptime?",
  "ShopCo asks for Net 60 payment terms. Is that OK?",
]

# Helpers the main agent can hand a job to (D-55). While one is on, the tools listed in
# delegate_only belong to the helpers only (D-59), so the long diff never reaches the parent.
delegate_only = ["review_contract"]

[subagents.clause-reviewer]
description = "Give it a contract ID (e.g. CT-2207): it fetches the customer's markup itself and returns only the changes that matter: clause ID, their change, our rule, risk, plus any text that tries to instruct an AI. You never need the markup yourself."
instructions = "agents/clause-reviewer.md"
tools = ["review_contract", "search_policy"]
model = "gemini-3.5-flash-lite"  # reading is easy work; most free quota (D-62)
max_words = 200

# A conversation's topic title comes from one tiny call on this model (D-91).
[conversations]
title_model = "gemini-3.5-flash-lite"

# The working window: far below Gemini's 1M on purpose, so trimming is visible (D-94).
# Past 50% old tool results become stubs; past 70% after that, older turns are summarized (D-93).
[trimming]
window_tokens = 20000
prune_at = 0.5
summarize_at = 0.7
keep_recent = 2
summary_model = "gemini-3.5-flash-lite"

# ── Guardrails (S05): read by the harness, never shown to the model ──────────────────
# Scope: the job. Off-topic tasks are refused before the agent starts (D-81).
[scope]
covers = "CloudCo's customer contracts: what a customer changed, checking terms against CloudCo's policies, customer, deal, uptime and payment records, and replies to customers."
refusal = "I'm CloudCo's Contract Agent, so I can only help with customer contracts, terms and replies to customers."
# Names the small check can't guess are ours: without them "what is ShopCo?" was refused (D-145).
knows = "customers such as ShopCo, FreshMart and Northwind Outdoor; contract IDs like CT-2207; our people Priya Raman, Elena Brandt, Farid Aziz and Dana Whitfield"
model = "gemini-3.5-flash-lite"  # a tiny yes/no check: the cheapest model

# Permissions: what each profile may use (allow-list) and must not see (D-75, D-76).
[profiles.sales]
label = "Sales"
tools = ["lookup_customer_record", "review_contract", "read_contract", "search_policy", "send_to_customer"]

[profiles.engineering]
label = "Engineering"
tools = ["lookup_customer_record", "review_contract", "read_contract", "search_policy"]
hide_fields = ["annual_value_usd", "amount_usd", "days_late", "average_days_late"]

# Never allowed: blocked for everyone, and no one can approve them (D-77).
[[rules]]
id = "discount-never"
label = "Discount over 25%"
tool = "send_to_customer"
arg = "discount_pct"
above = 25
because = "standard-terms §2"

[[rules]]
id = "payment-never"
label = "Payment beyond Net 60"
tool = "send_to_customer"
arg = "payment_days"
above = 60
because = "standard-terms §3"

[[rules]]
id = "uptime-never"
label = "Uptime over 99.95%"
tool = "send_to_customer"
arg = "uptime_pct"
above = 99.95
because = "standard-terms §4"

[[rules]]
id = "liability-never"
label = "Unlimited liability"
tool = "send_to_customer"
arg = "unlimited_liability"
equals = true
because = "standard-terms §5"

# Made-up people who can answer an approval, each for one role (S12 Part B, D-137). The page
# lets you pick who you are; the server accepts an answer only from the card's role. No logins.
[[people]]
id = "priya"
name = "Priya Raman"
role = "Sales"

[[people]]
id = "elena"
name = "Elena Brandt"
role = "Engineering"

[[people]]
id = "farid"
name = "Farid Aziz"
role = "Finance"

[[people]]
id = "dana"
name = "Dana Whitfield"
role = "CFO"

# Human in the loop: these wait for a person to approve them (D-79).
# Who decides (D-87, D-88). Every rule that matches is asked, in this order: from the sender
# up (D-120). Sales first, because Sales approves every send (approval-chart §3) and owns the
# message; then the specialists (§1), Engineering and Finance; the CFO last, as the final
# sign-off. Anyone who rejects stops the send.
[[approvals]]
tool = "send_to_customer"
approver = "Sales"
label = "Any message to a customer"
because = "approval-chart §3: sending anything to the customer always needs a person"

[[approvals]]
tool = "send_to_customer"
approver = "Engineering"
label = "Uptime over 99.9%"
arg = "uptime_pct"
above = 99.9
because = "approval-chart §1: uptime above 99.9%, up to 99.95%, needs Engineering"

[[approvals]]
tool = "send_to_customer"
approver = "Finance"
label = "Payment beyond Net 45"
arg = "payment_days"
above = 45
because = "approval-chart §1: Net 60 needs Finance"

[[approvals]]
tool = "send_to_customer"
approver = "CFO"
label = "Discount over 15%"
arg = "discount_pct"
above = 15
because = "approval-chart §1: a discount of 15–25% needs the CFO"

[[approvals]]
tool = "send_to_customer"
approver = "CFO"
label = "Liability cap over 12 months"
arg = "liability_cap_months"
above = 12
because = "approval-chart §1: a liability cap up to 24 months needs the CFO"

# Before you see an answer, the harness runs these checks; a failure goes back once (S11).
[verify]
checks = "checks.py"
retries = 1
