# The guided tour of the harness (S13, D-168–D-177). Fictional company, people and numbers.
#
# Each step: a caption you record as your voice (`say`), where the replay stops (`until`),
# which Harness pane part opens (`show`), and an optional card over the chat (`card`).
# `until = "model_replied#3"`: play up to the main agent's 3rd model_replied, counted across
# the runs below; a helper's events play along but aren't counted. No `until`: nothing plays.
# Clips: audio/<step id>.webm|.m4a|.mp3|.ogg, recorded on the page at /?tour=record.

title = "How the Harness Works"
chat = "ShopCo Counter-Offer"  # the tour's conversation in the sidebar
profile = "sales"
person = "priya"
runs = ["runs/1-review.jsonl", "runs/2-send.jsonl"]  # recorded live, Flash-Lite, 2026-11-12
skip = ["online_evals_started", "online_evals_finished"]  # Observability isn't in this tour

[[steps]]
id = "01-jar"
title = "Brain in a Jar"
say = """
AI models are very good at reasoning and writing. But on their own, they can't take actions. Think of a brain in a jar: capable, but trapped. It can tell you how to send a proposal; it can't send it. This tour shows what we build around the model so it can do the work. Everything here is a real recorded run of an agent I built from scratch. The company and its data are made up.
"""

[[steps]]
id = "02-harness"
title = "Why We Need a Harness"
show = "pane"
say = """
As models get more powerful, we expect more than answers in a chat window. We want them to finish whole tasks: build a customer proposal, pull in the right information, and send it once it's approved. For that, the model needs a layer around it, like an operating system. That layer is the harness. An AI agent is the model plus the harness. Ours has four parts: an agentic loop, context and memory, tools, and guardrails. You can see each one on the right.
"""

[[steps]]
id = "03-use-case"
title = "The Use Case"
say = """
Here's the job this agent does. CloudCo is a made-up software company of about 200 people; it sells inventory software to retail chains. Two days before quarter end, its customer ShopCo sends back a 480,000-dollar-a-year renewal with about 60 edits. Five of them matter. Any software company with a deal desk knows this moment: what can Sales agree to, and who must sign off? The Contract Agent finds the changes that matter, checks each against CloudCo's standard terms, says who must approve, and drafts the reply. People decide; the agent never agrees on its own.
"""
card = """
### ShopCo's renewal: the five changes that matter
| ShopCo asks for | CloudCo's rule | Who decides |
|---|---|---|
| 3-year price lock | Up to 3 years | Sales |
| 25% discount | ≤ 15% Sales · 15–25% CFO · over 25% never | CFO |
| Net 60 payment | Net 45 Sales · Net 60 Finance | Finance |
| 99.99% uptime | Up to our record, 99.95% | Blocked → offer 99.95% |
| Unlimited liability | Up to 24 months of fees | Blocked → offer 24 months |

Made-up company, people and numbers.
"""

[[steps]]
id = "04-context"
title = "Context and Memory"
show = "context"
until = "tool_finished#2"
say = """
Priya from Sales asks the agent to review ShopCo's changes and send a counter-offer. Before the model sees a word, the harness builds its context. Context engineering decides what goes into the model's window for this task, and what stays out: the company's instructions, Priya's profile, and five facts from long-term memory. Memory is storage that lasts beyond the window. Skills load only when needed: here, contract review and replying to a customer. The window is finite. When it fills up, the harness either summarises older turns, which is shorter but loses detail, or prunes stale tool output and keeps the important turns word for word.
"""

[[steps]]
id = "05-loop"
title = "The Agentic Loop"
show = "loop"
until = "tool_finished#4"
say = """
Now the agentic loop. The model plans, acts with a tool, reads the result, and repeats until the goal is met. Here it looks up ShopCo, then writes itself a to-do list. The harness runs this loop, not the model. And it decides when to stop: when there's an answer, or after 25 steps, one dollar or two minutes, whichever comes first.
"""

[[steps]]
id = "06-tools"
title = "Tools"
show = "tools"
until = "tool_finished#6"
say = """
With tools, the model can do things in the world. The model only asks for a tool; the harness runs it and sends back the result. Here it hands the contract review to a helper agent, the clause reviewer, with its own slice of time and budget. The helper reads the contract and the policy. And look: a line hidden in the contract tries to instruct the AI to approve it. The harness flags it and fences it as data. Anything it asks for would still need a person.
"""

[[steps]]
id = "07-verify"
title = "Verification"
show = "verify"
until = "run_finished#1"
say = """
Before the answer reaches Priya, the harness checks it. Plain code reads the draft: is the plan complete, is every change covered, is the right approver named. The first draft missed two changes, so the harness sent it back. The model fixed it, and the new answer passed. That's self-verification, built into the loop. Notice too: the agent raises its concerns first, and asks before it drafts anything.
"""

[[steps]]
id = "08-guardrails"
title = "Guardrails"
show = "guard"
until = "file_saved#2"
say = """
Priya agrees and asks it to send. Now, guardrails. Different people get different access, and some actions need approval before they happen. Hard limits come first: lines the company never crosses. Then the email itself is checked against the terms. Then the approvals: Sales signs off, Engineering approves the uptime, Finance the payment terms, and the CFO the discount and the liability cap. Each must be the right person; the server checks who's answering. Only then does the email go out, to a local outbox, not real email.
"""

[[steps]]
id = "09-answer"
title = "The Answer"
show = "loop"
until = "end"
say = """
Here's the answer, checked again, with what the run cost: model calls, tokens, dollars and seconds. About a cent, on a small model. Every step you saw was saved as a trace, and that's how this tour plays it back.
"""

[[steps]]
id = "10-why"
title = "Why the Harness Matters"
show = "pane"
say = """
So that's the harness: a loop to pursue the goal, context and memory to stay grounded, tools to act, and guardrails to stay in control. How well you build it matters as much as which model you pick. And this agent is just a folder: its instructions, tools and skills. Point the same harness at another folder, and you have another agent.
"""
