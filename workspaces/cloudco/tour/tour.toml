# The guided tour of the harness (S13, D-168–D-177). Fictional company, people and numbers.
#
# Each step: a caption you record as your voice (`say`), where the replay stops (`until`),
# which Harness pane part opens (`show`), an optional card over the chat (`card`), and a
# scene for the diagram (`scene`: build, jar, harness or finale; else the small live diagram).
# The next step starts when the voice ends; `pause = N` adds N seconds to look (default 0).
# Cue marks in `say`, like `{tool_finished#2}`, play the run up to that event when the voice
# reaches that word (D-180); they never show in the subtitles.
# Pop marks, like `{pop:context}`, make that diagram part pop when the voice reaches the word
# (loop, context, tools or guard; D-184). In the `build` scene a part appears only when it pops.
# Scene marks, like `{scene:finale}`, switch the diagram's scene at that word (D-185).
# `until = "model_replied#3"`: play up to the main agent's 3rd model_replied, counted across
# the runs below; a helper's events play along but aren't counted. No `until`: nothing plays.
# Clips: audio/<step id>.webm|.m4a|.mp3|.ogg, recorded on the page at /?tour=record.

title = "How the Harness Works"
chat = "ShopCo Counter-Offer"  # the tour's conversation in the sidebar
profile = "sales"
person = "priya"
runs = ["runs/1-review.jsonl", "runs/2-send.jsonl"]  # recorded live, Flash-Lite, 2026-11-12
skip = ["online_evals_started", "online_evals_finished"]  # Observability isn't in this tour

[[steps]]
id = "01-jar"
title = "Brain in a Jar"
scene = "jar"
say = """
Welcome. In the next five minutes, we'll cover three things: what an AI model can't do on its own, why it needs a harness, and what a harness is. Then you'll see one at work, in a real recorded run of an agent I built from scratch. The company and its data are made up. First, the model on its own. AI models are very good at reasoning and writing. But on their own, they can't take actions. Think of a brain in a jar: capable, but trapped. It can tell you how to send a proposal; it can't send it.
"""

[[steps]]
id = "02-harness"
title = "Why We Need a Harness"
show = "pane"
scene = "build"
say = """
As models get more powerful, we expect more than answers in a chat window. We want them to finish whole tasks: build a customer proposal, pull in the right information, and send it once it's approved. For that, the model needs a layer around it, like an operating system. That layer is the harness. An AI agent is the model plus the harness. Ours has four parts: an {pop:loop} agentic loop, {pop:context} context and memory, {pop:tools} tools, and {pop:guard} guardrails. {scene:harness} You can see each one on the right.
"""

[[steps]]
id = "03-use-case"
title = "The Use Case"
say = """
Here's the job this agent does. CloudCo is a made-up software company of about 200 people; it sells inventory software to retail chains. Two days before quarter end, its customer ShopCo sends back a 480,000-dollar-a-year renewal with about 60 edits. Five of them matter. Any software company with a deal desk knows this moment: what can Sales agree to, and who must sign off? The Contract Agent finds the changes that matter, checks each against CloudCo's standard terms, says who must approve, and drafts the reply. People decide; the agent never agrees on its own.
"""
card = """
### ShopCo's renewal: the five changes that matter
| ShopCo asks for | CloudCo's rule | Who decides |
|---|---|---|
| 3-year price lock | Up to 3 years | Sales |
| 25% discount | ≤ 15% Sales · 15–25% CFO · over 25% never | CFO |
| Net 60 payment | Net 45 Sales · Net 60 Finance | Finance |
| 99.99% uptime | Up to our record, 99.95% | Blocked → offer 99.95% |
| Unlimited liability | Up to 24 months of fees | Blocked → offer 24 months |

Made-up company, people and numbers.
"""

[[steps]]
id = "04-context"
title = "Context and Memory"
show = "context"
until = "tool_finished#2"
say = """
Priya from Sales asks the agent to review ShopCo's changes and send a counter-offer. Before the model sees a word, the harness builds its context. {run_started#1} Context engineering decides what goes into the model's window for this task, and what stays out: the company's instructions, Priya's profile, and five facts from long-term memory. Memory is storage that lasts beyond the window. {scope_checked#1} Skills load only when needed: {model_replied#1} here, contract review {tool_finished#1} and replying to a customer. {tool_finished#2} The window is finite. When it fills up, the harness either summarises older turns, which is shorter but loses detail, or prunes stale tool output and keeps the important turns word for word.
"""

[[steps]]
id = "05-loop"
title = "The Agentic Loop"
show = "loop"
until = "tool_finished#4"
say = """
Now the agentic loop. The model plans, acts with a tool, reads the result, and repeats until the goal is met. Here it looks up ShopCo, {tool_finished#3} then writes itself a to-do list. {tool_finished#4} The harness runs this loop, not the model. And it decides when to stop: when there's an answer, or after 25 steps, one dollar or two minutes, whichever comes first.
"""

[[steps]]
id = "06-tools"
title = "Tools"
show = "tools"
until = "tool_finished#6"
say = """
With tools, the model can do things in the world. The model only asks for a tool; the harness runs it and sends back the result. Here it hands the contract review to a helper agent, {tool_started#5} the clause reviewer, with its own slice of time and budget. {tool_finished#5} The helper reads the contract and the policy. And look: a line hidden in the contract tries to instruct the AI to approve it. The harness flags it and fences it as data. Anything it asks for would still need a person. {tool_finished#6}
"""

[[steps]]
id = "07-verify"
title = "Verification"
show = "verify"
until = "run_finished#1"
say = """
Before the answer reaches Priya, the harness checks it. {verify_started#1} Plain code reads the draft: is the plan complete, is every change covered, is the right approver named. {verify_finished#1} The first draft missed two changes, so the harness sent it back. The model fixed it, {verify_started#2} and the new answer passed. {run_finished#1} That's self-verification, built into the loop. Notice too: the agent raises its concerns first, and asks before it drafts anything.
"""

[[steps]]
id = "08-guardrails"
title = "Guardrails"
show = "guard"
until = "file_saved#2"
say = """
Priya agrees and asks it to send. {tool_finished#9} Now, guardrails. Different people get different access, and some actions need approval before they happen. Hard limits come first: {limits_checked#1} lines the company never crosses. Then the email itself is checked against the terms. {action_checked#1} Then the approvals: {approval_requested#1} Sales signs off, {approval_requested#2} Engineering approves the uptime, {approval_requested#3} Finance the payment terms, {approval_requested#4} and the CFO the discount and the liability cap. {approval_decided#4} Each must be the right person; the server checks who's answering. Only then does the email go out, {file_saved#2} to a local outbox, not real email.
"""

[[steps]]
id = "09-answer"
title = "The Answer"
show = "loop"
until = "end"
say = """
{run_finished#2} Here's the answer, checked again, with what the run cost: model calls, tokens, dollars and seconds. About a cent, on a small model. Every step you saw was saved as a trace, and that's how this tour plays it back.
"""

[[steps]]
id = "10-why"
title = "Why the Harness Matters"
show = "pane"
scene = "finale"
say = """
So that's the harness: a loop to pursue the goal, context and memory to stay grounded, tools to act, and guardrails to stay in control. How well you build it matters as much as which model you pick. What you saw is the core. A production-grade harness needs more: breaking big tasks into smaller ones, deeper verification, routing each task to a model that matches its complexity, stronger protection against attacks, evals and observability, and more. And this agent is just a folder: its instructions, tools and skills. Point the same harness at another folder, and you have another agent.
"""
