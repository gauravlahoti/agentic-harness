<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <!-- Before any paint: apply a saved theme so the page never flashes the wrong one. -->
  <script src="/static/theme-init.js"></script>
  <title>agentic-harness</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
  <script src="/static/theme.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 12a7.4 7.4 0 1 1-2.17-5.23" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M19.6 4.2v4.2h-4.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg> agentic-harness</div>
    <p class="workspace" id="workspace-name">No workspace loaded</p>
    <div class="profile-box" id="profile-box" hidden>
      <label class="visually-hidden" for="profile">Profile</label>
      <select class="model-pick profile-pick" id="profile" name="profile"><button type="button"><selectedcontent></selectedcontent></button></select>
    </div>
    <nav aria-label="Sections">
      <a class="nav-item" href="#agent" data-view="agent">Agent</a>
      <a class="nav-item" href="#checks" data-view="checks">Checks</a>
    </nav>
    <div class="sidebar-foot">
      <p class="version" id="version"></p>
      <button type="button" class="theme-toggle" id="theme-toggle">
        <span class="visually-hidden to-dark">Switch to dark theme</span>
        <span class="visually-hidden to-light">Switch to light theme</span>
        <span class="theme-knob" aria-hidden="true">
          <svg class="theme-icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2" fill="currentColor"/>
            <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>
          </svg>
          <svg class="theme-icon moon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z"/>
          </svg>
        </span>
      </button>
    </div>
  </aside>

  <main>
    <!-- ── Agent view (S01) ─────────────────────────────────────────────── -->
    <section class="view view-agent" id="view-agent" aria-labelledby="agent-title">
      <h1 id="agent-title" class="visually-hidden">Agent</h1>
      <p id="run-status" class="visually-hidden" role="status"></p>

      <div class="thread" id="thread">
        <div class="empty" id="empty-state">
          <p class="empty-title" id="empty-title">What should the agent do?</p>
          <p class="hint" id="empty-hint">Load a workspace to start: <code>agentic-harness serve --workspace workspaces/hello</code></p>
          <div class="examples" id="examples"></div>
        </div>
      </div>

      <div class="dock">
        <form class="composer" id="composer">
          <label class="visually-hidden" for="task">Task</label>
          <textarea id="task" name="task" rows="1" maxlength="4000" placeholder="Ask the agent to do something…" required></textarea>
          <div class="composer-bar">
            <label class="visually-hidden" for="model">Model</label>
            <select class="model-pick" id="model" name="model"><button type="button"><selectedcontent></selectedcontent></button></select>
            <p class="composer-alert" id="composer-alert" role="status"></p>
            <button type="submit" class="send" id="send" aria-label="Send">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </form>
      </div>

      <!-- Icons the script copies in. Templates keep the strict security policy: no HTML strings. -->
      <template id="tpl-mark">
        <svg class="agent-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 12a7.4 7.4 0 1 1-2.17-5.23" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M19.6 4.2v4.2h-4.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </template>
      <template id="tpl-spark">
        <svg class="model-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c.6 4.6 3.4 7.4 9 9-5.6 1.6-8.4 4.4-9 9-.6-4.6-3.4-7.4-9-9 5.6-1.6 8.4-4.4 9-9Z" fill="currentColor"/></svg>
      </template>
      <template id="tpl-chevron">
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </template>
    </section>

    <!-- ── Checks view (S00) ────────────────────────────────────────────── -->
    <section class="view view-checks" id="view-checks" aria-labelledby="checks-heading" hidden>
      <header class="page-header">
        <h1 id="checks-heading">Checks</h1>
        <p class="smoke" id="smoke">
          <span class="pill" id="smoke-server">Server …</span>
          <span class="pill" id="smoke-key">Key …</span>
        </p>
      </header>

      <div class="panel">
        <div class="panel-bar">
          <div>
            <h2 id="checks-title">Offline test suite</h2>
            <p class="hint">Runs one fixed command: every offline test, no key, no cost.</p>
          </div>
          <button type="button" id="run-checks" class="primary">Run checks</button>
        </div>

        <p class="summary" id="summary" role="status">Not run yet.</p>
        <progress id="progress" max="1" value="0" aria-hidden="true"></progress>

        <ol class="rows" id="rows" aria-label="Test results"></ol>
      </div>
    </section>
  </main>
</body>
</html>
