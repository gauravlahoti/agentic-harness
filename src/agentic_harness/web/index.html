<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <!-- Before any paint: apply a saved theme so the page never flashes the wrong one. -->
  <script src="/static/theme-init.js"></script>
  <title>agentic-harness</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
  <script src="/static/theme.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span> agentic-harness</div>
    <p class="workspace">No workspace loaded</p>
    <nav aria-label="Sections">
      <a class="nav-item" href="/" aria-current="page">Checks</a>
    </nav>
    <div class="sidebar-foot">
      <p class="version" id="version"></p>
      <button type="button" class="theme-toggle" id="theme-toggle">
        <span class="visually-hidden to-dark">Switch to dark theme</span>
        <span class="visually-hidden to-light">Switch to light theme</span>
        <span class="theme-knob" aria-hidden="true">
          <svg class="theme-icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2" fill="currentColor"/>
            <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>
          </svg>
          <svg class="theme-icon moon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z"/>
          </svg>
        </span>
      </button>
    </div>
  </aside>

  <main>
    <header class="page-header">
      <h1>Checks</h1>
      <p class="smoke" id="smoke">
        <span class="pill" id="smoke-server">Server …</span>
        <span class="pill" id="smoke-key">Key …</span>
      </p>
    </header>

    <section class="panel" aria-labelledby="checks-title">
      <div class="panel-bar">
        <div>
          <h2 id="checks-title">Offline test suite</h2>
          <p class="hint">Runs one fixed command: every offline test, no key, no cost.</p>
        </div>
        <button type="button" id="run-checks" class="primary">Run checks</button>
      </div>

      <p class="summary" id="summary" role="status">Not run yet.</p>
      <progress id="progress" max="1" value="0" aria-hidden="true"></progress>

      <ol class="rows" id="rows" aria-label="Test results"></ol>
    </section>
  </main>
</body>
</html>
