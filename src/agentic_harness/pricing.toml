# Paid-tier prices in USD per 1 million tokens (standard, not batch).
# Source: aistudio.google.com/docs/pricing, checked 2026-11-10. Update by hand (D-25).
# On the free tier calls cost nothing; the harness still counts what they would cost,
# so the cost limit behaves the same on both tiers.
# Only models listed here can be picked on the page (D-31).
#
# "output" includes thinking tokens (Google bills them as output).

[models."gemini-3.8-flash"]
input = 0.75           # doubles to 1.50 on 2027-01-01
output = 3.75          # doubles to 7.50 on 2027-01-01
cached_input = 0.075   # doubles to 0.15 on 2027-01-01

[models."gemini-3.6-flash"]
input = 0.75           # doubles to 1.50 on 2027-01-01
output = 3.75          # doubles to 7.50 on 2027-01-01
cached_input = 0.075   # doubles to 0.15 on 2027-01-01
free_per_day = 20      # free-tier requests a day, seen live 2026-11 (optional field)

[models."gemini-3.5-flash-lite"]
input = 0.30
output = 2.50
cached_input = 0.03
free_per_day = 500     # from Google's own 429 message, 2026-11-11

# Claude (Anthropic), a paid option the person picks (D-102). Source: Anthropic's model table
# in the claude-api reference, checked 2026-11-10. Cache reads ~0.1x input (Sonnet 5.5: $0.20);
# cache writes 1.25x input (pricing.py). Haiku 5.5 doubles past 100K-token prompts (our
# working window is 20K, so the lower price applies).
[models."claude-haiku-5-5"]
input = 0.10
output = 0.50
cached_input = 0.01

[models."claude-sonnet-5-5"]
input = 2.00
output = 10.00
cached_input = 0.20
